server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Enable XSS filtering
    add_header X-XSS-Protection "1; mode=block" always;
    # Ensure all traffic is over HTTPS (when behind LB)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy (Adjusted for external API calls and inline scripts if necessary)
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;

    # ----------------------------------------------------
    # GZIP COMPRESSION
    # ----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ----------------------------------------------------
    # ROUTING
    # ----------------------------------------------------
    # SPA Routing: Redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------
    # CACHING STRATEGY
    # ----------------------------------------------------
    # Cache static assets (CSS, JS, Images, Fonts) for 1 year
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html to ensure users always get the latest version
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ----------------------------------------------------
    # HEALTH CHECK
    # ----------------------------------------------------
    # Endpoint for AWS Application Load Balancer / ECS health checks
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }

    # Block access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}